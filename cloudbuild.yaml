steps:
  # Step 1: Install Python dependencies needed by the upload utility
  - name: "python"
    entrypoint: pip
    args: ["install", "-r", "utils/requirements.txt", "--user"]

  # Step 2: Run the script to upload DAGs and Data to the Composer bucket
  - name: "python"
    entrypoint: python
    args:
      - "utils/add_dags_to_composer.py"
      - "--dags_directory=${_DAGS_DIRECTORY}"
      - "--data_directory=${_DATA_DIRECTORY}"
      - "--composer_bucket=${_DAGS_BUCKET}"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _DAGS_DIRECTORY: "workflows/"
  _DATA_DIRECTORY: "data/"
  _DAGS_BUCKET: "us-east4-demo-instance-186ddff6-bucket"
  _COMPOSER_ENV_NAME: "demo-instance"
  _COMPOSER_REGION: "us-east1"
